name: Bug report
description: Report a reproducible SEAM defect with a bounded evidence trail.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SEAM. Keep reports content-safe: do not include credentials, private data, provider session links, or sensitive exploit details.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime or SDK
        - Storage or migrations
        - Retrieval or graph
        - REST, MCP, CLI, TUI, or WebUI
        - Benchmarks or qualification
        - CI, packaging, or release
        - Documentation or continuity
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken, and what impact does it have?
      placeholder: A concise description of the observed defect and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Give the smallest deterministic reproducer, including commands and inputs that are safe to share.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: State the contract or result you expected.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and environment
      description: Include SEAM version or commit, OS, Python version, backend, relevant sanitized output, and verification already attempted.
      placeholder: |
        SEAM version/commit:
        OS and Python:
        Backend:
        Sanitized output:
        Verification attempted:
    validations:
      required: true

  - type: textarea
    id: boundary
    attributes:
      label: Scope and safety boundary
      description: Name affected namespaces, surfaces, or data classes and anything deliberately not tested.
      placeholder: The defect affects ...; I did not test ...
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private data, secret-bearing DSNs, and provider session or conversation links.
          required: true
        - label: This report is safe for everyone with repository access to read; sensitive security details belong in a private advisory.
          required: true
