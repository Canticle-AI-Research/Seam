name: Feature proposal
description: Propose a bounded SEAM capability or operator-workflow improvement.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the desired outcome and the governing SEAM contract. A roadmap idea is not implementation evidence.

  - type: textarea
    id: problem
    attributes:
      label: Problem or operator need
      description: What concrete problem should this solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior and the smallest useful scope.
    validations:
      required: true

  - type: dropdown
    id: contract
    attributes:
      label: Governing boundary
      options:
        - SEAM specification or MIRL contract
        - Existing runtime or public API behavior
        - Operator, CI, packaging, or release workflow
        - Benchmark or evidence contract
        - Documentation or continuity protocol
        - New decision required
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List tests, measurements, artifacts, or operator checks that would prove completion.
      placeholder: |
        - [ ] Deterministic test ...
        - [ ] Existing behavior remains ...
        - [ ] Evidence artifact records ...
    validations:
      required: true

  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions and risks
      description: State what is out of scope, key compatibility constraints, and potential safety or migration risks.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Proposal checks
      options:
        - label: I checked the current status, roadmap, and open issues for an existing owner.
          required: true
        - label: I have not presented planned behavior or an unverified benchmark claim as shipped fact.
          required: true
