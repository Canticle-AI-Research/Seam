# Canonical invocation: python -m <module>
name: Repository maintenance

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  maintenance-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce PR lifecycle policy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.ci.pr_lifecycle --repo "${GITHUB_REPOSITORY}"

      - name: Build maintenance report
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.ci.github_maintenance_report --repo "${GITHUB_REPOSITORY}" --output github-maintenance-report.md --json-output github-maintenance-report.json --strict

      # Uploaded even when the gate fails -- the report is how you find out
      # which branch or worktree tripped it.
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-maintenance-report
          path: |
            github-maintenance-report.md
            github-maintenance-report.json
