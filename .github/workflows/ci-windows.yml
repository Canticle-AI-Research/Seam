# Windows leg of test-and-benchmark, split out of ci.yml when CI moved to the
# seam-box self-hosted Linux runner (HISTORY#425). Windows cannot run there,
# and hosted Windows minutes are the most expensive tier on a private repo, so
# this is manual-only: run it before releases or when a change is
# platform-sensitive (paths, subprocess, installers). It spends hosted minutes
# and requires the account billing lock to be clear.
name: CI (Windows, manual)

on:
  workflow_dispatch:

permissions: read-all

jobs:
  test-and-benchmark-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[server,sbert,rerank,dash]"

      - name: Install test dependencies
        run: python -m pip install pytest httpx

      - name: Run tests
        run: python -m pytest test_seam_all/ tools/history/test_history_tools.py tools/streams/ tests/ -m "not external"

      - name: Verify SEAM history integrity
        run: python -m tools.history.verify_integrity

      - name: Verify SEAM history continuity
        run: python -m tools.history.verify_continuity --no-snapshot

      - name: Verify SEAM history routing
        run: python -m tools.history.verify_routing

      - name: Verify SEAM handoff registry
        run: python -m tools.history.verify_handoffs

      - name: Verify SEAM streams
        run: python -m tools.streams.verify_streams

      - name: Run benchmark suite
        run: python -m seam benchmark run all --output benchmark_bundle.json --format json

      - name: Gate benchmark suite
        run: python -m seam benchmark gate benchmark_bundle.json
