name: Project tracking

on:
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    concurrency:
      group: project-tracking-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconcile tracking labels and issue status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python -m tools.ci.project_tracking
          --repo "${{ github.repository }}"
          --event-name "${{ github.event_name }}"
          --event-path "${GITHUB_EVENT_PATH}"
          --apply
