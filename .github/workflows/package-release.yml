name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already set in pyproject.toml
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-package-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify protected-main release boundary
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
            echo "Package releases must be dispatched from ${DEFAULT_BRANCH}, not ${GITHUB_REF}." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v${REQUESTED_VERSION}"; then
            echo "Tag v${REQUESTED_VERSION} already exists; releases are immutable." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import string
          import tomllib
          from pathlib import Path

          project_file = Path("pyproject.toml")
          version = tomllib.loads(project_file.read_text(encoding="utf-8"))["project"]["version"]
          requested = os.environ["REQUESTED_VERSION"]

          def valid_identifiers(value: str, *, reject_numeric_leading_zero: bool) -> bool:
              allowed = string.ascii_letters + string.digits + "-"
              for identifier in value.split("."):
                  if not identifier or any(character not in allowed for character in identifier):
                      return False
                  if reject_numeric_leading_zero and identifier.isascii() and identifier.isdigit():
                      if len(identifier) > 1 and identifier.startswith("0"):
                          return False
              return True

          base, build_separator, build = requested.partition("+")
          core, prerelease_separator, prerelease = base.partition("-")
          core_parts = core.split(".")
          valid_core = len(core_parts) == 3 and all(
              part and part.isascii() and part.isdigit() and (part == "0" or not part.startswith("0"))
              for part in core_parts
          )
          valid_prerelease = not prerelease_separator or valid_identifiers(
              prerelease, reject_numeric_leading_zero=True
          )
          valid_build = not build_separator or valid_identifiers(
              build, reject_numeric_leading_zero=False
          )
          if "+" in build or not (valid_core and valid_prerelease and valid_build):
              raise SystemExit(f"requested version {requested!r} is not exact SemVer without a leading v")
          if version != requested:
              raise SystemExit(f"{project_file} version {version!r} does not match requested version {requested!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"version={version}", file=output)
              print(f"prerelease={str(bool(prerelease_separator)).lower()}", file=output)
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --sdist
          python -m twine check dist/*

      - name: Verify private release artifacts
        run: python -m tools.release.verify_private_artifacts dist/*

      - name: Smoke-test wheel
        run: |
          repo_root="$PWD"
          wheel="$(find "$repo_root/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[server,pgvector]" "seam-client==2.0.0"
          cd /tmp
          seam --help
          seam-mcp --help
          seam-server --help

      - name: Write artifact checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          dist = Path("dist")
          artifacts = sorted(
              path for path in dist.iterdir()
              if path.is_file() and path.name != "SHA256SUMS.txt"
          )
          if not artifacts:
              raise SystemExit("no release artifacts found")
          lines = [f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}" for path in artifacts]
          (dist / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload reviewed distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  private-github-release:
    needs: build
    runs-on: ubuntu-latest
    environment: private-package-release
    permissions:
      contents: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.build.outputs.version }}
          path: dist/

      - name: Verify downloaded artifact checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Create private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          tag_reserved=false
          publication_complete=false
          cleanup_failed_publication() {
            status=$?
            trap - EXIT
            if [[ "${status}" -eq 0 || "${tag_reserved}" != "true" || "${publication_complete}" == "true" ]]; then
              exit "${status}"
            fi
            set +e
            current_tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq '.object.sha' 2>/dev/null)"
            if [[ "${current_tag_sha}" != "${COMMIT_SHA}" ]]; then
              echo "Failed publication did not retain the expected tag target; leaving remote state for operator review." >&2
              exit "${status}"
            fi
            if ! release_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.tag_name == \"v${VERSION}\") | .draft")"; then
              echo "Could not inspect release state; leaving the expected tag for operator review." >&2
              exit "${status}"
            fi
            can_delete_tag=true
            if [[ "${release_draft}" == "true" ]]; then
              if ! gh release delete "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --yes; then
                can_delete_tag=false
              fi
            elif [[ "${release_draft}" == "false" ]]; then
              can_delete_tag=false
              echo "Release v${VERSION} is already published; refusing automatic cleanup." >&2
            fi
            if [[ "${can_delete_tag}" == "true" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/v${VERSION}" >/dev/null
            fi
            exit "${status}"
          }
          trap cleanup_failed_publication EXIT

          release_flags=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${DEFAULT_BRANCH}" --jq '.object.sha')"
          if [[ "${current_sha}" != "${COMMIT_SHA}" ]]; then
            echo "Release commit ${COMMIT_SHA} is no longer the current protected-main head ${current_sha}; restart the workflow." >&2
            exit 1
          fi
          tag_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" \
            -f sha="${COMMIT_SHA}" \
            --jq '.object.sha')"
          tag_reserved=true
          if [[ "${tag_sha}" != "${COMMIT_SHA}" ]]; then
            echo "Created tag v${VERSION} does not target release commit ${COMMIT_SHA}." >&2
            exit 1
          fi
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            "${release_flags[@]}" \
            --title "SEAM ${VERSION}" \
            --notes "Private proprietary SEAM runtime release ${VERSION}." \
            --generate-notes
          gh release edit "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
          publication_complete=true
