name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already set in pyproject.toml
        required: true
        type: string
      target:
        description: Release destination
        required: true
        default: private-github
        type: choice
        options:
          - private-github
          - pypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project_file = Path("public_pkg/pyproject.toml") if os.environ["RELEASE_TARGET"] == "pypi" else Path("pyproject.toml")
          version = tomllib.loads(project_file.read_text(encoding="utf-8"))["project"]["version"]
          requested = os.environ["REQUESTED_VERSION"].strip()
          if version != requested:
              raise SystemExit(f"{project_file} version {version!r} does not match requested version {requested!r}")
          print(f"version={version}", file=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"))
          PY

      - name: Build distributions (private)
        if: inputs.target == 'private-github'
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --sdist
          python -m twine check dist/*

      - name: Build distributions (public PyPI)
        if: inputs.target == 'pypi'
        run: |
          python -m pip install --upgrade build twine
          mkdir -p public-dist
          python tools/release/build_public.py --outdir public-dist

      - name: Enforce private/public distribution boundary
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          if [ "$RELEASE_TARGET" = "pypi" ]; then
            python -m tools.release.verify_distribution_boundary --target "$RELEASE_TARGET" public-dist/*
          else
            python -m tools.release.verify_distribution_boundary --target "$RELEASE_TARGET" dist/*
          fi

      - name: Smoke-test wheel (private)
        if: inputs.target == 'private-github'
        run: |
          repo_root="$PWD"
          wheel="$(find "$repo_root/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[server,pgvector]" "seam-client==2.0.0"
          cd /tmp
          seam --help
          seam-mcp --help
          seam-server --help
          python "$repo_root/tools/release/prove_hosted_api.py"

      - name: Smoke-test wheel (public PyPI)
        if: inputs.target == 'pypi'
        run: |
          python -m pip install public-dist/*.whl
          cd /tmp
          seam --help
          python -c "import seam_client, seam_runtime; assert seam_runtime.SeamClient is seam_client.SeamClient; assert seam_runtime.ConnectionError is seam_client.ConnectionError; assert not seam_runtime.has_full_runtime(); print('OK — API-only compatibility package')"

      - name: Upload reviewed private distributions
        if: inputs.target == 'private-github'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload reviewed public distributions
        if: inputs.target == 'pypi'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: public-dist/*
          if-no-files-found: error
          retention-days: 7

  private-github-release:
    if: inputs.target == 'private-github'
    needs: build
    runs-on: ubuntu-latest
    environment: private-package-release
    permissions:
      contents: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "SEAM ${VERSION}" \
            --notes "Private proprietary SEAM runtime release ${VERSION}."

  pypi-publish:
    if: inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.build.outputs.version }}
          path: dist/

      - name: Publish boundary-approved distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
