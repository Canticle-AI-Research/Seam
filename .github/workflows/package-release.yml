name: Package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already set in pyproject.toml
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project_file = Path("pyproject.toml")
          version = tomllib.loads(project_file.read_text(encoding="utf-8"))["project"]["version"]
          requested = os.environ["REQUESTED_VERSION"].strip()
          if version != requested:
              raise SystemExit(f"{project_file} version {version!r} does not match requested version {requested!r}")
          print(f"version={version}", file=open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"))
          PY

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build --wheel --sdist
          python -m twine check dist/*

      - name: Smoke-test wheel
        run: |
          repo_root="$PWD"
          wheel="$(find "$repo_root/dist" -maxdepth 1 -name '*.whl' -print -quit)"
          python -m pip install "${wheel}[server,pgvector]" "seam-client==2.0.0"
          cd /tmp
          seam --help
          seam-mcp --help
          seam-server --help

      - name: Upload reviewed distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  private-github-release:
    needs: build
    runs-on: ubuntu-latest
    environment: private-package-release
    permissions:
      contents: write
    steps:
      - name: Download reviewed distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "SEAM ${VERSION}" \
            --notes "Private proprietary SEAM runtime release ${VERSION}."
