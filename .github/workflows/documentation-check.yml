name: Documentation check

"on":
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-check:
    runs-on: [self-hosted, seam-box]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing base and lint dependencies
        run: python -m pip install -e ".[lint]"
      - name: Check local source references and pending reviews
        run: python -m tools.docs.sync_references --check
      - name: Check existing wiki navigation
        run: python -m tools.docs.verify_wiki
