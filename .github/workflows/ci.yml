# Canonical invocation: python -m <module>
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

# One CI run per ref; a new push cancels the superseded run. On a single
# self-hosted runner this stops stale runs from queueing behind fresh ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# All jobs run on the seam-box self-hosted runner (private-repo hosted minutes
# were burning real money; see HISTORY#425). The windows leg lives in
# ci-windows.yml (workflow_dispatch) because it cannot run on a Linux host.
# Self-hosted rules: no sudo steps, no host-mutating cleanup (the old hosted
# "Free runner disk space" step is deliberately gone), pip/HF caches persist
# between runs by design.
jobs:
  test-and-benchmark:
    # The seam-box runner executes one job at a time. Keep this advisory,
    # long-running suite behind the short smoke and required hygiene gates so
    # it cannot delay merge feedback by 20-30 minutes.
    needs:
      - repo-hygiene
      - chroma-real-smoke
      - locomo-quickstart-bil2
      - package-smoke
      - pgvector-integration
    runs-on: [self-hosted, seam-box]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The baseline reachability test needs origin/main. A depth-one PR
          # merge checkout cannot prove that ancestry and used to consume the
          # suite's sole allowlisted skip instead of exercising the policy.
          fetch-depth: 0

      - name: Check diff hygiene
        run: git diff --check

      - name: Bind writable offline model cache
        shell: bash
        run: |
          echo "HF_HOME=${RUNNER_TEMP}/seam-huggingface" >> "${GITHUB_ENV}"
          echo "HF_HUB_CACHE=${RUNNER_TEMP}/seam-huggingface/hub" >> "${GITHUB_ENV}"
          echo "HUGGINGFACE_HUB_CACHE=${RUNNER_TEMP}/seam-huggingface/hub" >> "${GITHUB_ENV}"
          echo "HF_HUB_DISABLE_TELEMETRY=1" >> "${GITHUB_ENV}"
          echo "HF_HUB_OFFLINE=1" >> "${GITHUB_ENV}"
          echo "TRANSFORMERS_CACHE=${RUNNER_TEMP}/seam-huggingface/transformers" >> "${GITHUB_ENV}"
          echo "TRANSFORMERS_OFFLINE=1" >> "${GITHUB_ENV}"

      - name: Restore pinned LoCoMo embedding snapshot
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/seam-huggingface
          key: hf-bge-small-en-v1.5-${{ needs.locomo-quickstart-bil2.outputs.embedding-revision }}-${{ runner.os }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        # `dash` (textual) is required, not optional, for this lane: the TUI in
        # seam_runtime/tui/ is the live dashboard, and tests/ enforces strict
        # no-skip, so "textual is not installed" would fail the run rather than
        # skip quietly. Without it the dashboard tests in test_seam_all/ also
        # skipped silently, which is how they went unexercised in CI.
        run: python -m pip install -e ".[server,sbert,rerank,dash]"

      - name: Install test dependencies
        # httpx is required by starlette.testclient (the server tests use TestClient);
        # it used to arrive transitively via chromadb, which is now an optional extra.
        #
        # markdown-it-py is pinned here for the same reason, before it bites the
        # same way: tests/audit/test_wiki_navigation.py imports tools.docs.verify_wiki
        # at module scope, and under strict no-skip a missing import aborts the whole
        # run rather than skipping. It currently arrives transitively through rich,
        # which is a base runtime dependency but pins only `markdown-it-py>=2.2.0`
        # with no upper bound -- so this lane would silently drift onto a major the
        # repo-hygiene gate refuses (`lint` pins >=4.0,<5.0). Pinning both lanes to
        # the same range is the parity this slice is about. PyYAML is likewise a
        # direct import in the issue/release configuration audit, not a dependency
        # that may arrive accidentally through the benchmark extras.
        run: python -m pip install pytest httpx 'markdown-it-py>=4.0,<5.0' 'PyYAML>=6.0,<7.0'

      - name: Linux installer smoke test
        run: sh ./installers/install_seam_linux.sh --dev

      - name: Run tests
        # External (real-service) tests are deselected here so they are NOT
        # silently skipped; they run in the pgvector-integration job. Strict
        # no-skip enforcement (tests/conftest.py) fails the run on any other skip.
        run: python -m pytest test_seam_all/ tools/history/test_history_tools.py tools/streams/ tests/ -m "not external" --durations=25

      - name: Verify SEAM history integrity
        run: python -m tools.history.verify_integrity

      - name: Verify SEAM history continuity
        run: python -m tools.history.verify_continuity --no-snapshot

      - name: Verify SEAM history routing
        run: python -m tools.history.verify_routing

      - name: Verify SEAM handoff registry
        run: python -m tools.history.verify_handoffs

      - name: Verify SEAM streams
        run: python -m tools.streams.verify_streams

      - name: Run benchmark suite
        run: python -m seam benchmark run all --output benchmark_bundle.json --format json

      - name: Gate benchmark suite
        run: python -m seam benchmark gate benchmark_bundle.json

      - name: External memory benchmark plan
        run: python -m tools.run_external_memory_benchmarks --plan --scope all --format json --output external-memory-benchmark-plan.json

      - name: Upload external memory benchmark plan
        uses: actions/upload-artifact@v4
        with:
          name: external-memory-benchmark-plan
          path: external-memory-benchmark-plan.json

  pgvector-integration:
    runs-on: [self-hosted, seam-box]
    services:
      pgvector:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: seam_ci
          POSTGRES_USER: seam_ci
          POSTGRES_PASSWORD: seam_ci_password
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U seam_ci -d seam_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[server]"

      - name: Install test dependencies
        run: python -m pip install pytest psycopg[binary]

      - name: Run all real-pgvector tests
        # Target the real-service test files explicitly (not `-m external` over all
        # of tests/) so collection does not import server/sbert test modules whose
        # deps this job does not install. PGVECTOR_TEST_DSN gates pk_composite +
        # substream; SEAM_PGVECTOR_DSN gates real_adapter. Strict no-skip
        # (tests/conftest.py, default on) fails the job if any of these skip.
        #
        # This list must name EVERY file carrying `pytest.mark.external`. It
        # previously named only three, so 13 of 23 external tests ran in no lane
        # at all; `-m "not external"` deselects rather than skips, so strict
        # no-skip could not see the gap. `test_ci_enforces_no_silent_skips`
        # now derives the required set from the test tree and fails if this
        # command omits any of them.
        env:
          PGPASSWORD: seam_ci_password
          SEAM_PGVECTOR_DSN: postgresql://seam_ci@localhost:55433/seam_ci
          PGVECTOR_TEST_DSN: "host=localhost port=55433 dbname=seam_ci user=seam_ci password=seam_ci_password"
        run: python -m pytest tests/audit/test_pgvector_real_adapter.py tests/audit/test_pgvector_pk_composite.py tests/audit/test_substream_isolation.py tests/audit/test_pgvector_render_contract.py tests/audit/test_pgvector_boundary_resync.py -q

  package-smoke:
    runs-on: [self-hosted, seam-box]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Smoke installed commands
        run: |
          seam --help
          seam-mcp --help
          seam-server --help

  repo-hygiene:
    runs-on: [self-hosted, seam-box]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        # The self-hosted box exposes python3 but no bare `python`; hosted
        # runners provided one implicitly.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check diff hygiene
        run: git diff --check

      - name: Install repository verification dependencies
        run: python -m pip install 'ruff>=0.6,<1.0' 'markdown-it-py>=4.0,<5.0'

      - name: Lint (correctness + import order)
        # `[tool.ruff.lint]` in pyproject.toml selects E4/E7/E9/F/I only --
        # correctness and import ordering, deliberately not style. The rule set
        # stays narrow because this is a required check; the SCOPE is the whole
        # repo (`extend-exclude` already drops archive/ and build/). Scoping it
        # to seam_runtime/tools/seam.py left tests/ -- roughly half the Python
        # in this repo -- unlinted, and two I001 errors sat there undetected.
        run: ruff check .

      - name: Verify SEAM handoff registry
        run: python -m tools.history.verify_handoffs

      # The remaining continuity gates used to run only in the advisory
      # `test-and-benchmark` job, so the machinery the whole status surface
      # rests on was the part that was optional. They are sub-second; a
      # required check is where they belong.
      - name: Verify SEAM history integrity
        run: python -m tools.history.verify_integrity

      - name: Verify SEAM temporal continuity
        run: python -m tools.history.verify_continuity --no-snapshot

      - name: Verify SEAM classification routing
        run: python -m tools.history.verify_routing

      - name: Verify SEAM streams
        run: python -m tools.streams.verify_streams

      - name: Verify SEAM wiki navigation
        run: python -m tools.docs.verify_wiki

      - name: Verify dependency source contract
        run: python -m tools.ci.verify_dependency_contract

      - name: Secret/session URL scan
        run: python -m tools.security.secret_scan --working-tree

  chroma-real-smoke:
    runs-on: [self-hosted, seam-box]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[server,chroma]"

      - name: Run real Chroma smoke
        run: python -m tools.ci.chroma_real_smoke

  locomo-quickstart-bil2:
    runs-on: [self-hosted, seam-box]
    outputs:
      embedding-revision: ${{ steps.locomo-embedding.outputs.revision }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned LoCoMo embedding cache identity
        id: locomo-embedding
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path

          source = Path("seam_runtime/derived_fact_context.py").read_text(
              encoding="utf-8"
          )
          revision = None
          for node in ast.parse(source).body:
              if not isinstance(node, ast.Assign):
                  continue
              if any(
                  isinstance(target, ast.Name)
                  and target.id == "DERIVED_FACTS_EMBEDDING_REVISION"
                  for target in node.targets
              ):
                  revision = ast.literal_eval(node.value)
                  break
          if (
              not isinstance(revision, str)
              or len(revision) != 40
              or any(
                  character not in "0123456789abcdef"
                  for character in revision
              )
          ):
              raise SystemExit("invalid pinned LoCoMo embedding revision")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"revision={revision}\n")
          PY

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/seam-huggingface
          key: hf-bge-small-en-v1.5-${{ steps.locomo-embedding.outputs.revision }}-${{ runner.os }}

      - name: Install package
        run: python -m pip install -e ".[server,sbert]"

      - name: Provision exact pinned LoCoMo embedding snapshot
        env:
          HF_HOME: ${{ runner.temp }}/seam-huggingface
          HF_HUB_CACHE: ${{ runner.temp }}/seam-huggingface/hub
          HUGGINGFACE_HUB_CACHE: ${{ runner.temp }}/seam-huggingface/hub
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_OFFLINE: "0"
          TRANSFORMERS_CACHE: ${{ runner.temp }}/seam-huggingface/transformers
          TRANSFORMERS_OFFLINE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from huggingface_hub import snapshot_download
          from seam_runtime.derived_fact_context import (
              DERIVED_FACTS_EMBEDDING_MODEL,
              DERIVED_FACTS_EMBEDDING_REVISION,
          )

          snapshot = snapshot_download(
              repo_id=DERIVED_FACTS_EMBEDDING_MODEL,
              revision=DERIVED_FACTS_EMBEDDING_REVISION,
          )
          if Path(snapshot).name != DERIVED_FACTS_EMBEDDING_REVISION:
              raise SystemExit(
                  "Hugging Face cache did not resolve the exact pinned revision"
              )
          PY

      - name: Run LoCoMo quickstart smoke
        env:
          HF_HOME: ${{ runner.temp }}/seam-huggingface
          HF_HUB_CACHE: ${{ runner.temp }}/seam-huggingface/hub
          HUGGINGFACE_HUB_CACHE: ${{ runner.temp }}/seam-huggingface/hub
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_CACHE: ${{ runner.temp }}/seam-huggingface/transformers
          TRANSFORMERS_OFFLINE: "1"
        run: python -m seam bench external --quickstart locomo --adapter seam --judge stub --output locomo.quickstart.json

      - name: Seal LoCoMo quickstart as BIL-2
        run: python -m seam bench seal locomo.quickstart.json --level BIL-2 --allow-stub-seal --output locomo.quickstart.bil2.json

      - name: Verify LoCoMo quickstart BIL-2 bundle
        run: python -m seam bench verify locomo.quickstart.bil2.json --format json > locomo.quickstart.verify.json

      - name: Upload LoCoMo quickstart artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locomo-quickstart-bil2
          path: |
            locomo.quickstart.json
            locomo.quickstart.bil2.json
            locomo.quickstart.verify.json
