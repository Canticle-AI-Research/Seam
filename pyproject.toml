[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seam-suite"
version = "2.4.1rc1"
description = "SEAM memory runtime and glassbox operator tooling for AI agents"
readme = "README.md"
# 2.4.0+ is the SEAM Distributed Runtime under BUSL-1.1 (NOTICE, LICENSE section 7A).
# LicenseRef-SEAM-Proprietary still covers reserved MIRL/HS-1 expression; Apache-2.0
# is retained only for unchanged Legacy Apache Materials already published at 1.3.x.
license = "LicenseRef-SEAM-Proprietary AND BUSL-1.1 AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "COMMERCIAL_LICENSE.md", "LICENSES/BUSL-1.1.txt", "LICENSES/Apache-2.0.txt"]
requires-python = ">=3.11"
classifiers = [
  "Private :: Do Not Upload",
]
keywords = ["ai", "agents", "memory", "mcp", "rag"]
dependencies = [
  "rich>=14.2,<16",
  "tiktoken>=0.8.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/Canticle-AI-Research/Seam"
Repository = "https://github.com/Canticle-AI-Research/Seam"
Issues = "https://github.com/Canticle-AI-Research/Seam/issues"

[project.optional-dependencies]
dash = ["textual>=8.0,<9.0", "httpx>=0.24,<1.0"]
# Opt-in only. chromadb 1.0.0-1.5.9 (the whole current 1.x line) carries an
# UNPATCHED critical advisory GHSA-f4j7-r4q5-qw2c (pre-auth code injection in the
# Chroma SERVER). SEAM uses only the embedded PersistentClient (no server, no
# auth surface), so the embedded path is not exposed - but chromadb is therefore
# kept out of core deps and out of `all-extras`; install it deliberately via
# `seam-suite[chroma]` only. Widen the pin to a patched release once one exists.
chroma = ["chromadb>=1.0,<2.0"]
pgvector = ["psycopg[binary]>=3.0,<4.0"]
sbert = ["sentence-transformers>=2.0,<3.0"]
server = ["fastapi>=0.100,<1.0", "uvicorn[standard]>=0.23,<1.0", "python-multipart>=0.0.6,<1.0"]
agent = []
rerank = ["sentence-transformers>=2.0,<3.0"]
bench-judge = ["anthropic>=0.40,<1.0", "openai>=1.0,<2.0"]
bench-mem0 = ["mem0ai>=0.1.0,<1.0", "chromadb>=0.4.0,<1.0"]
bench-zep = ["zep-cloud>=2.0.0,<3.0"]
# chromadb intentionally excluded: unpatched critical advisory (see `chroma` above); install via `seam-suite[chroma]` only.
all-extras = ["textual>=8.0,<9.0", "httpx>=0.24,<1.0", "psycopg[binary]>=3.0,<4.0", "sentence-transformers>=2.0,<3.0", "fastapi>=0.100,<1.0", "uvicorn[standard]>=0.23,<1.0", "python-multipart>=0.0.6,<1.0", "anthropic>=0.40,<1.0", "openai>=1.0,<2.0", "mem0ai>=0.1.0,<1.0", "zep-cloud>=2.0.0,<3.0"]
# Dev-only repository-verification tools, never runtime dependencies; install
# via `seam-suite[lint]`. markdown-it-py gives the wiki verifier CommonMark parsing
# semantics instead of maintaining an unsafe partial Markdown parser; PyYAML
# is imported directly by repository configuration tests.
lint = ["ruff>=0.6,<1.0", "markdown-it-py>=4.0,<5.0", "PyYAML>=6.0,<7.0", "packaging>=24,<27"]

[tool.uv]
# chroma and bench-mem0 pin incompatible chromadb majors on purpose: the
# embedded chroma path tracks 1.x, while mem0's benchmark harness requires the
# 0.4.x line. They are never installed together, and `all-extras` already
# excludes chromadb for the same reason. Declaring the conflict lets a resolver
# lock the project instead of failing; without it `uv lock` has no solution.
conflicts = [
    [{ extra = "chroma" }, { extra = "bench-mem0" }],
]

[tool.seam.dependency-contract]
schema = "seam-dependency-contract/1"
runtime-source = "project.dependencies"
installer-mirror = "requirements.txt"
lock-policy = "bounded-direct-requirements"
convenience-extra = "all-extras"
convenience-members = ["dash", "pgvector", "sbert", "server", "agent", "rerank", "bench-judge", "bench-mem0", "bench-zep"]
excluded-convenience-packages = ["chromadb"]
retired-extras = ["selfhost"]

[tool.seam.workspace-contract]
schema = "seam-workspace-contract/1"
# Gitignored entries are invisible to `git status`, so they accumulate forever
# and no gate sees them. Ten worktree/artifact hygiene incidents (HISTORY#406,
# #534, #555, #567-569, #604) were each "fixed" by adding a .gitignore line,
# which hides the next occurrence instead of preventing it. This contract is
# the checked authority for what may exist untracked in a working tree;
# `tools.git.verify_workspace` fails on anything undeclared.
#
# Adding a path here is a deliberate, reviewable act. Adding a .gitignore line
# without adding it here now fails the gate.
# Entries may be exact names or globs. Globs exist because several legitimate
# artifacts carry generated names (`seam_suite.egg-info/`, per-store lock files).
allowed-ignored-roots = [
    ".claude", ".context-handoffs", ".cursor", ".dataset_store", ".gemini",
    ".lingma", ".opencode", ".pytest_cache", ".seam_chroma", ".ssh", ".ua",
    ".venv", ".vscode", "__pycache__", "archive", "build", "conversations",
    "credentials", "dist", "exports", "secrets", "selfhost",
    "*.egg-info", ".seam-store-*.lock", ".seam-runtime-*.lock", "*.seam-backups",
    "seam.db", "seam.db-wal", "seam.db-shm", "seam.db-journal",
]
# Disposable sinks: contents are regenerable and may be pruned at any time.
# Each is size-budgeted so a stray binary or an unbounded dump fails loudly
# instead of sitting there for months.
sink-roots = [".playwright-mcp", ".wrangler", "diag_out", "test_seam", "visuals", "Webui-final-dash"]
max-sink-mb = 25
# A single large file inside a sink is the specific shape of the original
# incident: HISTORY#406 found a 4.5MB compiled binary sitting in visuals/.
# A total-size budget alone does not catch it.
max-sink-file-mb = 2
# Stray scratch files at the repository root. AGENTS.md already forbids these
# in prose; this makes it enforceable.
forbidden-root-globs = ["test_*", "Test*", "*_scratch.db", "*.png", "page-snapshot.md"]
# A worktree per concurrent task is reasonable; a drawer full of them is the
# failure mode HISTORY#223 and #534 describe.
max-worktrees = 3
# Never permitted in the tree at all. These are gitignored, so git stays quiet
# about them, but "declare it in the contract" is the wrong remedy for a
# private key. CLAUDE.md requires immediate deletion or redaction, so the gate
# says that instead. tools.security.secret_scan inspects content; this catches
# the file existing at all.
forbidden-if-present = [
    "credentials.json", "service_account.json", ".env",
    "id_rsa", "id_rsa.*", "id_ed25519", "id_ed25519.*", "id_ecdsa", "id_ecdsa.*",
    "*.pem", "*.key", "*.p12", "*.pfx",
]

[project.scripts]
seam = "seam:main"
seam-benchmark = "seam:benchmark_main"
seam-dash = "seam_runtime.dashboard:main"
seam-tui = "seam_runtime.tui.app:main"
seam-server = "seam_runtime.server:main"
seam-mcp = "seam_runtime.mcp_protocol:main"

[tool.setuptools]
py-modules = ["seam"]

[tool.setuptools.packages.find]
include = ["seam_runtime*"]

[tool.setuptools.package-data]
# Ship the browser dashboard assets so `seam serve`/`seam webui` can serve the
# UI from the installed package, not just from a source checkout.
seam_runtime = ["webui/*", "webui/**/*", "tui/*.tcss"]

[tool.setuptools.exclude-package-data]
# Operator-local Codex profile; never ship in the wheel.
seam_runtime = ["config.toml"]

[tool.ruff]
line-length = 120
extend-exclude = ["archive", "build"]

[tool.ruff.lint]
# Correctness (F, E4/E7/E9) + import ordering (I). Deliberately excludes E501
# (line-too-long) and other pure-style rules: this repo has no formatter
# convention yet, and style-only noise would drown the findings that matter.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Both structurally require imports after non-import statements: dashboard.py
# guards optional rich/textual imports with try/except fallback assignments,
# and install_seam.py must mutate sys.path before importing the local package.
"seam_runtime/dashboard.py" = ["E402"]
"installers/install_seam.py" = ["E402"]
